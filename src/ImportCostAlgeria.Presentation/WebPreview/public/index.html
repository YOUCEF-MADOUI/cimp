<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CIMP — Coût d'Importation Algérie</title>
<style>
  :root {
    --bg: #0f172a; --panel: #ffffff; --sidebar: #111c33; --accent: #0e7c66; --accent-dark: #0b5f4f;
    --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --danger: #dc2626; --warn: #d97706; --info: #2563eb; --block: #7f1d1d;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f1f5f9; color: var(--text); }
  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 230px; background: var(--sidebar); color: #cbd5e1; flex-shrink: 0; padding: 18px 0; }
  #sidebar .brand { color: #fff; font-weight: 700; font-size: 1.05rem; padding: 0 18px 16px; border-bottom: 1px solid #263353; margin-bottom: 10px; }
  #sidebar .brand small { display:block; color:#94a3b8; font-weight:400; font-size:0.72rem; margin-top:3px;}
  #sidebar nav a { display: block; padding: 10px 18px; color: #cbd5e1; text-decoration: none; font-size: 0.88rem; cursor:pointer; border-left:3px solid transparent;}
  #sidebar nav a:hover { background: #1a2947; color:#fff; }
  #sidebar nav a.active { background:#16233f; color:#fff; border-left-color: var(--accent); font-weight:600; }
  #sidebar .company-picker { margin: 0 12px 14px; }
  #sidebar select { width:100%; padding:6px; border-radius:6px; border:none; font-size:0.8rem; }
  #main { flex: 1; padding: 22px 28px; max-width: 1200px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 14px; }
  h3 { font-size: 0.95rem; margin: 14px 0 8px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .grid { display: grid; gap: 14px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  label { display:block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight:600; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px; font-family: inherit; }
  textarea { resize: vertical; min-height: 50px; }
  button, .btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.83rem; font-weight:600; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { background: var(--accent-dark); }
  button.secondary, .btn.secondary { background: #64748b; }
  button.danger, .btn.danger { background: var(--danger); }
  button.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table th, table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  table th { background: #f8fafc; font-weight:600; }
  table tbody tr:hover { background: #f8fafc; }
  .kpis { display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:18px; }
  .kpi { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .kpi .num { font-size:1.4rem; font-weight:700; color: var(--accent-dark); }
  .kpi .lbl { font-size:0.75rem; color:var(--muted); }
  .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:600; }
  .pill.INFO { background:#dbeafe; color:var(--info); }
  .pill.AVERTISSEMENT { background:#fef3c7; color:var(--warn); }
  .pill.ERREUR { background:#fee2e2; color:var(--danger); }
  .pill.BLOCAGE { background:#450a0a; color:#fff; }
  .pill.ok { background:#dcfce7; color: var(--success); }
  .tag { display:inline-block; padding:1px 7px; border-radius:5px; font-size:0.68rem; font-weight:700; text-transform:uppercase; }
  .tag.officielle { background:#e0f2fe; color:#075985; }
  .tag.utilisateur { background:#ede9fe; color:#5b21b6; }
  .tag.calcul { background:#dcfce7; color:#166534; }
  .tag.ia { background:#fff7ed; color:#c2410c; }
  .wizard-steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .wizard-steps .step { padding:6px 12px; border-radius:20px; background:#e2e8f0; font-size:0.76rem; font-weight:600; color:#475569; }
  .wizard-steps .step.active { background: var(--accent); color:#fff; }
  .wizard-steps .step.done { background:#bbf7d0; color:#166534; }
  .toast { position:fixed; bottom:20px; right:20px; background:#111c33; color:#fff; padding:12px 18px; border-radius:8px; font-size:0.85rem; max-width:380px; z-index:999; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }
  .muted { color: var(--muted); font-size:0.78rem; }
  .actions-row { display:flex; gap:8px; margin: 10px 0; flex-wrap:wrap; }
  .empty-state { text-align:center; padding: 40px 20px; color: var(--muted); }
  .badge-status { padding:2px 8px; border-radius:5px; font-size:0.7rem; font-weight:700; background:#e2e8f0; }
  .file-drop { border: 2px dashed var(--border); border-radius: 10px; padding: 30px; text-align:center; color: var(--muted); cursor:pointer; }
  .file-drop:hover { border-color: var(--accent); color: var(--accent); }
  .small-input { width: 90px !important; display:inline-block; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">CIMP <small>Coût d'Importation Algérie — V1.3</small></div>
    <div class="company-picker">
      <label style="color:#94a3b8;">Entreprise active</label>
      <select id="companySelect"></select>
    </div>
    <nav id="mainNav">
      <a data-view="dashboard">📊 Tableau de bord</a>
      <a data-view="companies">🏢 Entreprises</a>
      <a data-view="products">📦 Produits</a>
      <a data-view="imports">🚢 Importations</a>
      <a data-view="regulatory">⚖️ Réglementation</a>
      <a data-view="rates">💱 Taux de change</a>
      <a data-view="audit">🧾 Journal d'audit</a>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
